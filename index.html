<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Village RPG — 1838–1900</title>
<meta name="description" content="A browser-based educational RPG set in post-emancipation Jamaica. Walk the village, farm the land, survive history.">
<link rel="stylesheet" href="css/style.css">
<style>
#error-box {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0;
  max-height: 40vh;
  overflow: auto;
  background: #2a0000;
  color: #ffb3b3;
  font-family: monospace;
  font-size: 12px;
  padding: 10px 14px;
  z-index: 9999;
  border-bottom: 2px solid #ff4444;
  white-space: pre-wrap;
}
#error-box.show { display: block; }
</style>
</head>
<body>
<div id="error-box"></div>
<div id="game-container"></div>

<script>
  // Surface any runtime error directly on the page instead of failing
  // silently (which is what makes blank-screen bugs so hard to diagnose
  // on GitHub Pages, where devtools aren't always open).
  window.addEventListener('error', function(e) {
    const box = document.getElementById('error-box');
    box.classList.add('show');
    box.textContent += (box.textContent ? '\n\n' : '') +
      'ERROR: ' + e.message +
      '\n' + (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || '') +
      (e.error && e.error.stack ? '\n' + e.error.stack : '');
  });
</script>

<!-- Phaser 3 from CDN -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

<!-- Game modules -->
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/scenes/BootScene.js"></script>
<script src="js/scenes/VillageScene.js"></script>
<script src="js/scenes/UIScene.js"></script>
<script src="js/main.js"></script>
</body>
</html>
